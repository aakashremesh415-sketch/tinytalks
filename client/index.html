<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b0e14" />

    <!--
      Static SEO/AEO baseline for the homepage. This is the reliable
      fallback: it's correct on its own even if the build-time prerender
      step (scripts/prerender.mjs, which injects real marketing copy into
      #root below) ever fails or is skipped — the site should never ship
      with broken/missing meta tags just because that script had a bug.

      Non-homepage routes (e.g. /terms, /login) override title/description/
      canonical/robots at runtime via src/lib/seo.js's useSeo() hook, for
      any crawler that executes JavaScript. Crawlers and link-preview bots
      that DON'T execute JS (most social-media unfurlers, some AI answer
      engines) will see these homepage-oriented defaults regardless of
      which route was requested — an inherent limitation of a single-page
      app without full server-side rendering, and why the FAQ/WebApplication
      JSON-LD below is deliberately kept in sync by hand with
      src/content/seoJsonLd.js + src/content/faq.js (same content, update
      both together).
    -->
    <title>tinytalks.live — Free Random Chat App | Talk to Strangers Anonymously</title>
    <meta name="description" content="tinytalks is a free random chat app for anonymous, end-to-end encrypted conversations with real strangers. No account required — start chatting as a guest in seconds." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tinytalks.live/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="tinytalks.live" />
    <meta property="og:title" content="tinytalks.live — Free Random Chat App | Talk to Strangers Anonymously" />
    <meta property="og:description" content="A free random chat app for anonymous, end-to-end encrypted conversations with real strangers. No account required to start." />
    <meta property="og:url" content="https://tinytalks.live/" />
    <meta property="og:image" content="https://tinytalks.live/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="tinytalks.live — Free Random Chat App | Talk to Strangers Anonymously" />
    <meta name="twitter:description" content="A free random chat app for anonymous, end-to-end encrypted conversations with real strangers. No account required to start." />
    <meta name="twitter:image" content="https://tinytalks.live/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://tinytalks.live/#website",
            "url": "https://tinytalks.live",
            "name": "tinytalks.live",
            "description": "A free, anonymous, end-to-end encrypted random chat app for talking to strangers."
          },
          {
            "@type": "Organization",
            "@id": "https://tinytalks.live/#organization",
            "name": "tinytalks.live",
            "url": "https://tinytalks.live",
            "logo": "https://tinytalks.live/favicon.svg"
          },
          {
            "@type": "WebApplication",
            "@id": "https://tinytalks.live/#webapplication",
            "name": "tinytalks",
            "url": "https://tinytalks.live",
            "applicationCategory": "SocialNetworkingApplication",
            "operatingSystem": "Any (web browser)",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "description": "A free random chat app for anonymous, end-to-end encrypted conversations with strangers. No account required to start."
          },
          {
            "@type": "FAQPage",
            "@id": "https://tinytalks.live/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is tinytalks?",
                "acceptedAnswer": { "@type": "Answer", "text": "tinytalks is a free random chat app that connects you with a real stranger for a private, one-on-one conversation. There is no account required to start — you can begin chatting as a guest in seconds." }
              },
              {
                "@type": "Question",
                "name": "Is tinytalks free to use?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. Starting a random chat, sending text messages, and using the gender-preference matching filter are all free." }
              },
              {
                "@type": "Question",
                "name": "Is tinytalks anonymous?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. You can chat as a guest with no email, phone number, or real name required — guests are given a random display name automatically. Guest accounts and their data are permanently deleted after 2 days." }
              },
              {
                "@type": "Question",
                "name": "Are messages on tinytalks encrypted?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. Every message is end-to-end encrypted on your device before it's sent, using the same public-key cryptography (X25519 + XSalsa20-Poly1305) behind apps like Signal. tinytalks' own servers only ever see encrypted ciphertext, never your plaintext messages." }
              },
              {
                "@type": "Question",
                "name": "Can I choose who I match with?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. You can set a gender-matching preference (anyone, men, women, or non-binary) and add optional location tags or interests, which tinytalks uses as a soft preference when finding your next chat partner." }
              },
              {
                "@type": "Question",
                "name": "Can I send photos on tinytalks?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes, after a quick, free, ID-free verification step. Photos are end-to-end encrypted and self-destruct after a one-time view or a short timer, so they are not kept around after your chat." }
              },
              {
                "@type": "Question",
                "name": "Can I add someone as a friend and talk to them again?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. If you enjoy a conversation, you can send a friend request from that chat. Once accepted, you can start a new conversation with that person any time, separately from tinytalks' random matching." }
              },
              {
                "@type": "Question",
                "name": "How do I stay safe while chatting with strangers?",
                "acceptedAnswer": { "@type": "Answer", "text": "tinytalks lets you block anyone instantly — they will never be matched with you again — and report a conversation to a real, human-reviewed moderation queue. Never share personal information like your address, financial details, or passwords with someone you have just met." }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
